[pytest]
testpaths = tests
pythonpath = .
addopts = -ra --strict-markers --strict-config
xfail_strict = true
timeout = 60
markers =
    e2e: end-to-end tests that launch the real app in a pseudo-terminal against a fake Ollama HTTP server (deselect with -m "not e2e")
    known_bug: documents a confirmed defect in the current code; runs as a strict xfail until fixed
filterwarnings =
    error::pytest.PytestUnhandledThreadExceptionWarning
